# VirtualHost for the main domain (Example: Under Construction page)
<VirtualHost *:443>
    ServerName your.domain.com # Replace with your actual base domain
    DocumentRoot /var/www/captive/client

    # Serve the under-construction page for the root
    DirectoryIndex under-construction.html

    ErrorLog ${APACHE_LOG_DIR}/your.domain.com-error.log
    CustomLog ${APACHE_LOG_DIR}/your.domain.com-access.log combined

    SSLEngine on
    # Replace with the actual path to your SSL certificate and key files
    SSLCertificateFile /etc/letsencrypt/live/your.domain.com/fullchain.pem 
    SSLCertificateKeyFile /etc/letsencrypt/live/your.domain.com/privkey.pem

    # Basic directory settings for the base domain
    <Directory /var/www/captive/client>
        Options Indexes FollowSymLinks
        AllowOverride None # .htaccess not needed for the simple under-construction page
        Require all granted
    </Directory>
</VirtualHost>

# VirtualHost for the captive portal subdomain (Example)
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName captive.your.domain.com # Replace with your actual captive portal subdomain
    # ServerAlias www.captive.your.domain.com # Optional: if you want www subdomain too

    # This should point to the directory where your client-side files (index.html, etc.) are deployed
    DocumentRoot /var/www/captive/client 

    ErrorLog ${APACHE_LOG_DIR}/captive-error.log
    CustomLog ${APACHE_LOG_DIR}/captive-access.log combined

    SSLEngine on
    # Replace with the actual path to your SSL certificate and key files
    SSLCertificateFile /etc/letsencrypt/live/your.domain.com/fullchain.pem 
    SSLCertificateKeyFile /etc/letsencrypt/live/your.domain.com/privkey.pem

    # Enable SSL for the reverse proxy
    SSLProxyEngine On
    # Add these lines to relax backend SSL certificate checks for localhost
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
    # SSLProxyVerify none # Use this if the above are not enough (less secure)

    # Proxy configuration for API (forward requests to backend service)
    ProxyPreserveHost On
    ProxyPass /api/ https://127.0.0.1:4000/ # Adjust backend address/port if needed
    ProxyPassReverse /api/ https://127.0.0.1:4000/ # Adjust backend address/port if needed

    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>
    
    # Allow CORS for all origins and enable .htaccess for the captive portal
    <Directory /var/www/captive/client> 
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
        AllowOverride All # Needed for .htaccess rewrite rules used by the portal
        Require all granted
    </Directory>

</VirtualHost>

# VirtualHost for HTTP redirect (Example - redirects both base and subdomain)
<VirtualHost *:80>
    ServerName your.domain.com # Replace with your actual base domain
    ServerAlias captive.your.domain.com # Replace with your actual captive portal subdomain

    # Redirect all HTTP traffic to HTTPS equivalent
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/redirect-access.log combined
</VirtualHost>
